name: Advanced Testing & Coverage

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          # ✅ Agregar working-directory para la cache
          cache-dependency-path: api-rest-demo/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: api-rest-demo  # ✅ Agregar esto
      
      - name: Run Jest Tests
        run: npm test
        working-directory: api-rest-demo  # ✅ Agregar esto
      
      # Publicar Reporte JUnit en la UI de GitHub
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Jest Tests
          path: api-rest-demo/test-results/junit.xml  # ✅ Actualizar path
          reporter: jest-junit
      
      # Subir Cobertura a Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./api-rest-demo/coverage/cobertura-coverage.xml  # ✅ Actualizar path
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  load-testing:
    runs-on: ubuntu-latest
    needs: test-and-coverage
    
    steps:
      - uses: actions/checkout@v4
      
      # ✅ FORMA OFICIAL Y ROBUSTA DE INSTALAR K6 EN GITHUB ACTIONS
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      
      - name: Run k6 load test
        run: k6 run api-rest-demo/loadtests/api-load.js --out json=results.json
      
      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-load-test-results
          path: results.json
          retention-days: 14